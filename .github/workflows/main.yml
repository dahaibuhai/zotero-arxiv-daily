name: Send emails daily
on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * 1-5'

permissions:
  contents: write

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.REPOSITORY || github.repository }}
          ref: ${{ vars.REF || github.ref_name }}
          persist-credentials: true
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          version: '0.5.4'

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          ZOTERO_IGNORE: ${{ vars.ZOTERO_IGNORE }}
          SEND_EMPTY: ${{ vars.SEND_EMPTY }}
          ENABLE_ARXIV: ${{ vars.ENABLE_ARXIV || 'true' }}
          ARXIV_QUERY: ${{ vars.ARXIV_QUERY }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          MAX_PAPER_NUM: ${{ vars.MAX_PAPER_NUM }}
          USE_LLM_API: ${{ secrets.USE_LLM_API }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
          LANGUAGE: ${{ vars.LANGUAGE }}
          KEYWORD_FILTER_MODE: ${{ vars.KEYWORD_FILTER_MODE || 'boost' }}
          KEYWORDS_BOOST: ${{ vars.KEYWORDS_BOOST }}
          KEYWORDS_REQUIRE: ${{ vars.KEYWORDS_REQUIRE }}
          KEYWORDS_EXCLUDE: ${{ vars.KEYWORDS_EXCLUDE }}
          KEYWORD_BOOST_WEIGHT: ${{ vars.KEYWORD_BOOST_WEIGHT || '1.5' }}
          ENABLE_SEMANTIC_SCHOLAR: ${{ vars.ENABLE_SEMANTIC_SCHOLAR || 'true' }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          SEMANTIC_SCHOLAR_QUERIES: ${{ vars.SEMANTIC_SCHOLAR_QUERIES }}
          SEMANTIC_SCHOLAR_DAYS: ${{ vars.SEMANTIC_SCHOLAR_DAYS || '7' }}
          SEMANTIC_SCHOLAR_MAX_RESULTS_PER_QUERY: ${{ vars.SEMANTIC_SCHOLAR_MAX_RESULTS_PER_QUERY || '5' }}
          ENABLE_CROSSREF: ${{ vars.ENABLE_CROSSREF }}
          CROSSREF_JOURNALS: ${{ vars.CROSSREF_JOURNALS }}
          CROSSREF_DAYS: ${{ vars.CROSSREF_DAYS }}
          CROSSREF_ROWS_PER_JOURNAL: ${{ vars.CROSSREF_ROWS_PER_JOURNAL }}
          CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
          SENT_HISTORY_PATH: data/sent_history.json
          SENT_HISTORY_DAYS: "90"
        run: |
          uv run main.py

      - name: Persist sent history
        if: success()
        run: |
          if [ -z "$(git status --porcelain -- data/sent_history.json)" ]; then
            echo "Sent history is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sent_history.json
          git commit -m "chore: update sent history"
          git push
