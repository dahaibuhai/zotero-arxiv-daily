name: Test workflow
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: literature-delivery-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.REPOSITORY || github.repository }}
          ref: ${{ vars.REF || github.ref_name }}
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          version: '0.5.4'

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          ZOTERO_IGNORE: ${{ vars.ZOTERO_IGNORE }}
          ARXIV_QUERY: ${{ vars.ARXIV_QUERY }}
          ENABLE_ARXIV: ${{ vars.ENABLE_ARXIV || 'true' }}
          SEND_EMPTY: ${{ vars.SEND_EMPTY }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          MAX_PAPER_NUM: ${{ vars.MAX_PAPER_NUM || '10' }}
          ARXIV_QUOTA: ${{ vars.ARXIV_QUOTA || '5' }}
          SEMANTIC_SCHOLAR_QUOTA: ${{ vars.SEMANTIC_SCHOLAR_QUOTA || '5' }}
          USE_LLM_API: ${{ secrets.USE_LLM_API }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
          LANGUAGE: ${{ vars.LANGUAGE }}
          KEYWORD_FILTER_MODE: ${{ vars.KEYWORD_FILTER_MODE || 'boost' }}
          KEYWORDS_BOOST: ${{ vars.KEYWORDS_BOOST }}
          KEYWORDS_REQUIRE: ${{ vars.KEYWORDS_REQUIRE }}
          KEYWORDS_EXCLUDE: ${{ vars.KEYWORDS_EXCLUDE }}
          KEYWORD_BOOST_WEIGHT: ${{ vars.KEYWORD_BOOST_WEIGHT || '1.5' }}
          ENABLE_SEMANTIC_SCHOLAR: ${{ vars.ENABLE_SEMANTIC_SCHOLAR || 'true' }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          SEMANTIC_SCHOLAR_QUERIES: ${{ vars.SEMANTIC_SCHOLAR_QUERIES }}
          SEMANTIC_SCHOLAR_DAYS: ${{ vars.SEMANTIC_SCHOLAR_DAYS || '14' }}
          SEMANTIC_SCHOLAR_MAX_RESULTS_PER_QUERY: "20"
          ENABLE_CLASSIC_FALLBACK: ${{ vars.ENABLE_CLASSIC_FALLBACK || 'true' }}
          CLASSIC_FALLBACK_NUM: ${{ vars.SEMANTIC_SCHOLAR_QUOTA || '5' }}
          CLASSIC_FALLBACK_CANDIDATES_PER_QUERY: "200"
          CLASSIC_FALLBACK_MAX_CANDIDATES_PER_QUERY: "500"
          CLASSIC_FALLBACK_MIN_CITATIONS: "5"
          CLASSIC_FALLBACK_RELEVANCE_THRESHOLD: ${{ vars.CLASSIC_FALLBACK_RELEVANCE_THRESHOLD || '0.65' }}
          CLASSIC_FALLBACK_NO_KEYWORD_RELEVANCE_THRESHOLD: ${{ vars.CLASSIC_FALLBACK_NO_KEYWORD_RELEVANCE_THRESHOLD || '0.78' }}
          CLASSIC_FALLBACK_IMPACT_TOP_FRACTION: ${{ vars.CLASSIC_FALLBACK_IMPACT_TOP_FRACTION || '0.25' }}
          ENABLE_CROSSREF: ${{ vars.ENABLE_CROSSREF }}
          CROSSREF_JOURNALS: ${{ vars.CROSSREF_JOURNALS }}
          CROSSREF_DAYS: ${{ vars.CROSSREF_DAYS }}
          CROSSREF_ROWS_PER_JOURNAL: ${{ vars.CROSSREF_ROWS_PER_JOURNAL }}
          CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
          DELIVERY_LEDGER_PATH: data/daily_delivery.json
          SENT_HISTORY_PATH: .tmp/sent_history_test.json
          SENT_HISTORY_DAYS: "90"
          CLASSIC_SENT_HISTORY_PATH: .tmp/classic_sent_history_test.json
        run: |
          uv run main.py --debug

      - name: Persist successful delivery day
        if: always() && steps.checkout.outcome == 'success'
        run: |
          if [ -z "$(git status --porcelain -- data/daily_delivery.json)" ]; then
            echo "Delivery day is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily_delivery.json
          git commit -m "chore: record successful test delivery day"
          git push
